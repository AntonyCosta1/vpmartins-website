<!--obrigado.html-->
<!DOCTYPE html>
<html lang = "pt-BR">
    <head>
        <meta charset = "UTF-8">
        <title>Mensagem enviada</title>
        <meta name="viewport" content="widht=device-widht", "initial-scale=1.0">
        <style>
            *{
                box-sizing: border-box;
                margin: 0px;
                padding: 0px;
            }
            body{
                height: 100vh;
                display: flex;
                background-color: #f7f7f7;
                justify-content: center;
                align-items: center;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
            .container{
                background: white;
                padding: 40px 30px;
                border-radius: 12px;
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
                text-align: center;
                max-widht: 400px;
            }
            .container h1{
                color: #c1121f;
                margin-bottom: 10px;
                font-size: 24px;
            }
            .container p{
                color: #333;
                margin-bottom: 25px;
                font-size: 16px;
            }

            .container a {
                display: inline-block;
                text-decoration: none;
                color: white;
                background-color: #c1121f;
                padding: 12px 24px;
                border-radius: 8px;
                transition: background-color 0.3s ease;
            }
            .container a hover{
                 background-color: #9a0e1a;
            }

        </style>
    </head>
    <body>
        <div class = "container">
            <h1>Mensagem enviada com sucesso!</h1>
            <p>Obrigado por entrar em contato. Em breve te retornaremos!</p>
            <a href = "index.html">Voltar ao inicio</a>
        </div>
    </body>
</html>
